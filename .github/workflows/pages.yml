# Builds the CrownPVP site, pulls fresh punishments from LiteBans, and publishes to GitHub Pages.
# Repository secrets needed: DB_HOST, DB_PORT, DB_USER, DB_NAME, DB_PASS (Settings > Secrets and variables > Actions).
# Settings > Pages > Source must be set to "GitHub Actions".
name: Publish site
on:
  push: { branches: [main] }
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pymysql
      - name: Copy public site files
        run: |
          mkdir -p _site
          if [ -d "crownpvp" ]; then
            rsync -a --exclude functions --exclude server --exclude dev --exclude schema.sql --exclude wrangler.toml \
              --exclude .dev.vars.example --exclude README.md --exclude _headers --exclude _redirects crownpvp/ _site/
          else
            rsync -a --exclude .git --exclude .github --exclude supabase --exclude litebans-sync \
              --exclude functions --exclude server --exclude dev --exclude schema.sql --exclude wrangler.toml \
              --exclude .dev.vars.example --exclude README.md --exclude _headers --exclude _redirects --exclude _site ./ _site/
          fi
          touch _site/.nojekyll
      - name: Export punishments from LiteBans
        continue-on-error: true
        run: |
          if [ -f "litebans-sync/sync-litebans.py" ] && [ -n "$DB_HOST" ]; then
            python litebans-sync/sync-litebans.py --export _site/data/punishments
          fi
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASS: ${{ secrets.DB_PASS }}
      - uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
