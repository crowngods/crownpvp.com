name: Publish site
on:
  push: { branches: [main] }
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pymysql
      - name: Copy public site files
        run: |
          mkdir _site
          rsync -a --exclude functions --exclude server --exclude dev --exclude schema.sql --exclude wrangler.toml \
            --exclude .dev.vars.example --exclude README.md --exclude _headers --exclude _redirects crownpvp/ _site/
      - name: Export punishments from LiteBans
        run: python litebans-sync/sync-litebans.py --export _site/data/punishments
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASS: ${{ secrets.DB_PASS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
