name: Publish site

on:
  push:
    branches:
      - main

  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install LiteBans export dependency
      - name: Install dependencies
        run: pip install pymysql

      # Prepare website files
      - name: Copy public site files
        run: |
          mkdir -p _site

          rsync -a \
            --exclude functions \
            --exclude server \
            --exclude dev \
            --exclude schema.sql \
            --exclude wrangler.toml \
            --exclude .dev.vars.example \
            --exclude README.md \
            --exclude _headers \
            --exclude _redirects \
            crownpvp/ _site/

      # Export LiteBans punishments
      - name: Export punishments from LiteBans
        run: |
          python litebans-sync/sync-litebans.py --export _site/data/punishments
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASS: ${{ secrets.DB_PASS }}

      # Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Upload website artifact
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages

      # Allow GitHub artifact service to register the upload
      - name: Wait for artifact registration
        run: sleep 15

      # Deploy website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
